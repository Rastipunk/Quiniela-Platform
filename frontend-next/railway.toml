[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build && cp -r .next/static .next/standalone/.next/static && rm -rf .next/standalone/public && cp -r public .next/standalone/public && echo 'Brand assets copied:' && ls .next/standalone/public/brand/ | wc -l"

[deploy]
startCommand = "node .next/standalone/server.js"
healthcheckPath = "/"
healthcheckTimeout = 120

[build.env]
NODE_ENV = "production"
NIXPACKS_NODE_VERSION = "22"
